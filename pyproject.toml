[project]
name = "eyedroppy"
version = "0.1.0"
description = "Eyedropper for picking palettes from images 👁️🎨"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.11",
    "pylette>=6.0.0",
]

[project.scripts]
eyedroppy = "eyedroppy.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyedroppy"]
